name: Validate learning content
on:
  push:
    paths: ['questions.json', 'app.js', 'guide.json', 'style.css', 'scripts/**', 'docs/question-authoring.md', '.github/workflows/validate-questions.yml']
  pull_request:
    paths: ['questions.json', 'app.js', 'guide.json', 'style.css', 'scripts/**', 'docs/question-authoring.md', '.github/workflows/validate-questions.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/validate_questions.py
      - run: node --check app.js
      - run: node scripts/test_ui.cjs
